resources:
  jobs:
    read_volume_job:
      name: read-volume-job

      tasks:
        - task_key: read_volume_task

          spark_python_task:
            python_file: src/notebook/read_from_volume.py

          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
