jobs:
  medallion_pipeline:
    name: medallion_pipeline

    job_clusters:
      - job_cluster_key: shared_cluster
        new_cluster:
          spark_version: 14.3.x-scala2.12
          node_type_id: Standard_DS3_v2
          num_workers: 1

    tasks:
      - task_key: bronze_task
        job_cluster_key: shared_cluster
        spark_python_task:
          python_file: src/notebook/bronze.py

      - task_key: silver_task
        depends_on:
          - task_key: bronze_task
        job_cluster_key: shared_cluster
        spark_python_task:
          python_file: src/notebook/silver.py

      - task_key: gold_task
        depends_on:
          - task_key: silver_task
        job_cluster_key: shared_cluster
        spark_python_task:
          python_file: src/notebook/gold.py
