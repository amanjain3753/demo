resources:
  jobs:
    medallion_pipeline:
      name: medallion_pipeline
      run_as:
        user_name: amanmaikhuri.24031100@gehu.ac.in

      tasks:
        - task_key: bronze_task
          spark_python_task:
            python_file: ${workspace.file_path}/src/notebook/bronze.py
          environment_key: serverless_env

        - task_key: silver_task
          depends_on:
            - task_key: bronze_task
          spark_python_task:
            python_file: ${workspace.file_path}/src/notebook/silver.py
          environment_key: serverless_env

        - task_key: gold_task
          depends_on:
            - task_key: silver_task
          spark_python_task:
            python_file: ${workspace.file_path}/src/notebook/gold.py
          environment_key: serverless_env

      environments:
        - environment_key: serverless_env
          spec:
            environment_version: "2"
